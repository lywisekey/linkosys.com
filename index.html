<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    	<!-- Google Font -->
  	<link rel="preconnect" href="https://fonts.googleapis.com">
	  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <title>Linkosys | Technology Consulting and Engineering for Government and Enterprise</title>

    <!-- Base metadata. The router overwrites these per route once the app boots;
         these values are what crawlers and link unfurlers see before that. -->
    <meta name="description" content="Linkosys delivers software engineering, AI and data, cloud, cybersecurity, IT staffing and program management for U.S. government and enterprise organizations.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0a1928">
    <link rel="canonical" href="https://linkosys.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Linkosys">
    <meta property="og:title" content="Linkosys | Technology Consulting and Engineering">
    <meta property="og:description" content="Software engineering, AI and data, cloud, cybersecurity, IT staffing and program management for government and enterprise organizations.">
    <meta property="og:url" content="https://linkosys.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Linkosys | Technology Consulting and Engineering">
    <meta name="twitter:description" content="Software engineering, AI and data, cloud, cybersecurity, IT staffing and program management for government and enterprise organizations.">
    <meta name="twitter:image" content="https://linkosys.com/images/og-default.png">
    <meta property="og:image" content="https://linkosys.com/images/og-default.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://linkosys.com/#organization",
      "name": "Linkosys",
      "legalName": "Linkosys Inc.",
      "url": "https://linkosys.com",
      "logo": "https://linkosys.com/images/logo.svg",
      "description": "U.S. technology consulting and engineering firm delivering software development, data and AI, cloud, cybersecurity, program management and technology staffing for government and enterprise organizations.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "100 Spectrum Center Dr",
        "addressLocality": "Irvine",
        "addressRegion": "CA",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-949-354-4225",
        "email": "info@linkosys.com",
        "contactType": "sales"
      }
    }
    </script>

    <style>
      #splash-screen {
        position: fixed;
        top: 50%;
        left: 50%;
        background: #0a1928;
        display: flex;
        height: 100%;
        width: 100%;
        transform: translate(-50%, -50%);
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s linear;
        overflow: hidden;
      }
  
      #splash-screen.remove {
        animation: fadeout 0.7s forwards;
        z-index: 0;
      }
  
      @keyframes fadeout {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
    
  </head>
  <body>
    <div id="app"></div>
    <div id="splash-screen">
      <img alt="Logo" class="light" src="./src/assets/images/logo.svg" style="height: 10%; max-width: 60%;" />
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const appEl = document.querySelector('#app')
      new MutationObserver(() => {
        document.querySelector('#splash-screen')?.classList.add('remove');
      }).observe(appEl, { childList: true })
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sticky-js/1.3.0/sticky.min.js" integrity="sha512-3z3zGiu0PabNyuTAAfznBJFpOg4owG9oQQasE5BwiiH5BBwrAjbfgIe0RCdtHJ0BQV1YF2Shgokbz2NziLnkuQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </body>
</html>
