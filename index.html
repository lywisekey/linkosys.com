    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts are self-hosted; these two cover the first screen and are fetched
         immediately rather than after the stylesheet parses. -->
    <link rel="preload" href="/fonts/instrument-sans-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Declared here, not in the deferred stylesheet, so the first paint can
         already use them. -->
    <style>@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/instrument-sans-400-latin.woff2') format('woff2')}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/instrument-sans-500-latin.woff2') format('woff2')}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/instrument-sans-600-latin.woff2') format('woff2')}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/instrument-sans-700-latin.woff2') format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/inter-400-latin.woff2') format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/inter-500-latin.woff2') format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/inter-600-latin.woff2') format('woff2')}</style>

    <title>Linkosys | Technology Consulting and Engineering for Government and Enterprise</title>

         these values are what crawlers and link unfurlers see before that. -->

    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0a1928">
    <link rel="canonical" href="https://linkosys.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Linkosys">
    <meta property="og:title" content="Linkosys | Technology Consulting and Engineering">
    <meta property="og:description" content="Software engineering, AI and data, cloud, cybersecurity, IT staffing and program management for government and enterprise organizations.">
    <meta property="og:url" content="https://linkosys.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Linkosys | Technology Consulting and Engineering">
    <meta name="twitter:description" content="Software engineering, AI and data, cloud, cybersecurity, IT staffing and program management for government and enterprise organizations.">
    <meta name="twitter:image" content="https://linkosys.com/images/og-default.png">
    <meta property="og:image" content="https://linkosys.com/images/og-default.png">
    <meta property="og:image:secure_url" content="https://linkosys.com/images/og-default.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://linkosys.com/#organization",
      "name": "Linkosys",
      "legalName": "Linkosys Inc.",
      "url": "https://linkosys.com",
      "foundingDate": "2016",
      "telephone": "+1-949-354-4225",

    <style>
      #splash-screen {
        position: fixed;
        top: 50%;
        left: 50%;
        background: #0a1928;
        display: flex;
        height: 100%;
        width: 100%;
        transform: translate(-50%, -50%);
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s linear;
        overflow: hidden;
      }
  
      #splash-screen.remove {
        animation: fadeout 0.7s forwards;
        z-index: 0;
      }
  
      @keyframes fadeout {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
    
  </head>
  <body>
    <div id="app"></div>
    <div id="splash-screen">
      <img alt="Logo" class="light" src="./src/assets/images/logo.svg" style="height: 10%; max-width: 60%;" />
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Prerendered pages ship with #app already populated, so the observer that
      // used to wait for Vue's first render would never fire and the splash
      // would stay up. Hide it immediately when content is already present, and
      // keep a timeout so a failed boot never leaves a blank overlay.
      (function () {
        var appEl = document.querySelector('#app')
        var hide = function () {
          document.querySelector('#splash-screen')?.classList.add('remove')
        }
        if (appEl && appEl.childElementCount > 0) return hide()
        new MutationObserver(hide).observe(appEl, { childList: true })
        setTimeout(hide, 4000)
      })()
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sticky-js/1.3.0/sticky.min.js" integrity="sha512-3z3zGiu0PabNyuTAAfznBJFpOg4owG9oQQasE5BwiiH5BBwrAjbfgIe0RCdtHJ0BQV1YF2Shgokbz2NziLnkuQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </body>
