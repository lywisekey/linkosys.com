<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.5 32.3 421.1 275.3" width="520" height="340" fill="none" role="presentation">
  <style>
    .flow-software { stroke-dasharray: 5 7; animation: flow-software 3.4s linear infinite; }
    @keyframes flow-software { to { stroke-dashoffset: -24 } }
    .beat-software { animation: beat-software 3.6s ease-in-out infinite; }
    @keyframes beat-software { 0%,100% { opacity: .32 } 50% { opacity: 1 } }
    .rise-software { animation: rise-software 5s ease-in-out infinite; }
    @keyframes rise-software { 0%,12% { opacity: 0; transform: translateY(9px) } 30%,88% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(9px) } }
    @media (prefers-reduced-motion: reduce) {
      .flow-software, .beat-software, .rise-software { animation: none; }
      .rise-software { opacity: 1; transform: none; }
      .flow-software { stroke-dasharray: none; }
    }
  </style>
