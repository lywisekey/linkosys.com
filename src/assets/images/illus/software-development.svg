  <style>
    .fl-software { animation: fl-software 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-software { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-software { animation: pulse-software 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-software { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-software { stroke-dasharray: 220; animation: draw-software 5s ease-in-out infinite; }
    @keyframes draw-software { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-software, .pulse-software, .draw-software { animation: none; }
      .draw-software { stroke-dasharray: none; }
    }
  </style>
