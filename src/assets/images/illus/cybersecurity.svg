  <style>
    .fl-security { animation: fl-security 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-security { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-security { animation: pulse-security 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-security { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-security { stroke-dasharray: 220; animation: draw-security 5s ease-in-out infinite; }
    @keyframes draw-security { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-security, .pulse-security, .draw-security { animation: none; }
      .draw-security { stroke-dasharray: none; }
    }
  </style>
