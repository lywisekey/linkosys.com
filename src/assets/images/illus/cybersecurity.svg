    .beat-security { animation: beat-security 3.6s ease-in-out infinite; }
    @keyframes beat-security { 0%,100% { opacity: .32 } 50% { opacity: 1 } }
    .rise-security { animation: rise-security 5s ease-in-out infinite; }
    @keyframes rise-security { 0%,12% { opacity: 0; transform: translateY(9px) } 30%,88% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(9px) } }
    @media (prefers-reduced-motion: reduce) {
      .flow-security, .beat-security, .rise-security { animation: none; }
      .rise-security { opacity: 1; transform: none; }
      .flow-security { stroke-dasharray: none; }
    }
  </style>
