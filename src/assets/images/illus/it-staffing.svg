  <style>
    .fl-staffing { animation: fl-staffing 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-staffing { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-staffing { animation: pulse-staffing 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-staffing { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-staffing { stroke-dasharray: 220; animation: draw-staffing 5s ease-in-out infinite; }
    @keyframes draw-staffing { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-staffing, .pulse-staffing, .draw-staffing { animation: none; }
      .draw-staffing { stroke-dasharray: none; }
    }
  </style>
