  <style>
    .fl-program { animation: fl-program 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-program { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-program { animation: pulse-program 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-program { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-program { stroke-dasharray: 220; animation: draw-program 5s ease-in-out infinite; }
    @keyframes draw-program { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-program, .pulse-program, .draw-program { animation: none; }
      .draw-program { stroke-dasharray: none; }
    }
  </style>
