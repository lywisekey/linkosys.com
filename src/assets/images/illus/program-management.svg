<svg xmlns="http://www.w3.org/2000/svg" viewBox="51.2 32.6 441.8 288.9" width="520" height="340" fill="none" role="presentation">
  <style>
    .flow-program { stroke-dasharray: 5 7; animation: flow-program 3.4s linear infinite; }
    @keyframes flow-program { to { stroke-dashoffset: -24 } }
    .beat-program { animation: beat-program 3.6s ease-in-out infinite; }
    @keyframes beat-program { 0%,100% { opacity: .32 } 50% { opacity: 1 } }
    .rise-program { animation: rise-program 5s ease-in-out infinite; }
    @keyframes rise-program { 0%,12% { opacity: 0; transform: translateY(9px) } 30%,88% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(9px) } }
    @media (prefers-reduced-motion: reduce) {
      .flow-program, .beat-program, .rise-program { animation: none; }
      .rise-program { opacity: 1; transform: none; }
      .flow-program { stroke-dasharray: none; }
    }
  </style>
