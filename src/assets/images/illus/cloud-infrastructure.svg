    .beat-cloud { animation: beat-cloud 3.6s ease-in-out infinite; }
    @keyframes beat-cloud { 0%,100% { opacity: .32 } 50% { opacity: 1 } }
    .rise-cloud { animation: rise-cloud 5s ease-in-out infinite; }
    @keyframes rise-cloud { 0%,12% { opacity: 0; transform: translateY(9px) } 30%,88% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(9px) } }
    @media (prefers-reduced-motion: reduce) {
      .flow-cloud, .beat-cloud, .rise-cloud { animation: none; }
      .rise-cloud { opacity: 1; transform: none; }
      .flow-cloud { stroke-dasharray: none; }
    }
  </style>
