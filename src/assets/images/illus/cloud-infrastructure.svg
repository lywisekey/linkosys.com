<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.4 -25.1 443.0 276.9" width="480" height="300" fill="none" role="presentation">
  <style>
    .fl-cloud { animation: fl-cloud 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-cloud { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-cloud { animation: pulse-cloud 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-cloud { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-cloud { stroke-dasharray: 220; animation: draw-cloud 5s ease-in-out infinite; }
    @keyframes draw-cloud { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-cloud, .pulse-cloud, .draw-cloud { animation: none; }
      .draw-cloud { stroke-dasharray: none; }
    }
  </style>
