  <style>
    .fl-data { animation: fl-data 6s ease-in-out infinite; transform-origin: center; }
    @keyframes fl-data { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    .pulse-data { animation: pulse-data 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse-data { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .draw-data { stroke-dasharray: 220; animation: draw-data 5s ease-in-out infinite; }
    @keyframes draw-data { 0% { stroke-dashoffset: 220 } 45%,100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fl-data, .pulse-data, .draw-data { animation: none; }
      .draw-data { stroke-dasharray: none; }
    }
  </style>
